name: Windows checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            target: x86_64-pc-windows-gnu
          - architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned GNU toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1-${{ matrix.target }} --profile minimal
      - name: Install the pinned ARM64 linker
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $package = 'llvm-mingw-20261117-ucrt-aarch64.zip'
          $archive = Join-Path $env:RUNNER_TEMP $package
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$package" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne
              'c7f56de1d7aca15196c19083a799205390397b8b87a825aec3485e1e4f3c2cdd') {
              throw 'llvm-mingw archive checksum did not match.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $toolchain = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($package))
          Join-Path $toolchain 'bin' | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and package DeXDesk
        shell: pwsh
        run: .\build.ps1 -Test -Architecture ${{ matrix.architecture }}
      - name: Smoke-test the packaged UI
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'dexdesk-smoke'
          $process = Start-Process -FilePath .\dist\DeXDesk.exe -ArgumentList '--smoke-ui' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000)) {
              $process.Kill()
              throw 'DeXDesk smoke test did not exit within 15 seconds.'
          }
          if ($process.ExitCode -ne 0) {
              throw "DeXDesk smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Save packaged executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: DeXDesk-${{ matrix.architecture }}
          path: dist\DeXDesk.exe
          if-no-files-found: error
